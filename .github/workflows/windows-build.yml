name: Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build release
        shell: powershell
        run: ./scripts/build-release.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NER-Text-Assist-Windows
          path: installer/output/*.exe
          if-no-files-found: error

      - name: Publish permanent GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.1"
          $installer = (Get-ChildItem "installer/output/*.exe" | Select-Object -First 1).FullName
          if (-not $installer) { throw "Installer not found" }
          $notes = "Tahap 1 fix release - improved DOCX whitespace and line-break extraction, header/footer text extraction while ignoring visual content, safer XLSX extraction, and better CSV delimiter detection."

          cmd /c "gh release view $tag >nul 2>nul"
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $tag "$installer" --clobber
          } else {
            gh release create $tag "$installer" --title "NER Text Assist 0.2.1" --notes "$notes" --prerelease
          }
